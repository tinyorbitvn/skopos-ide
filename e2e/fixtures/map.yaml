# The resource map's objects (spec E §18.3), with network policies and Argo CD objects
# (spec §3.3). e2e/helpers/fixtures.ts applies this before the app starts, after the
# Gateway API CRDs, once the Cilium and Argo CD CRDs of scripts/kind-up.sh are established.
apiVersion: v1
kind: Namespace
metadata:
  name: skopos-e2e-map
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: skopos-e2e-map
spec:
  controllerName: example.com/skopos-e2e
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: skopos-e2e-map
spec:
  gatewayClassName: skopos-e2e-map
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  parentRefs:
    - name: edge
  rules:
    - backendRefs:
        - name: web
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: skopos-e2e-map
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: skopos-e2e-map
data:
  mode: e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: skopos-e2e-map
stringData:
  TOKEN: e2e-map-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
  namespace: skopos-e2e-map
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      serviceAccountName: web
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: web-secret
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: web-config
        - name: data
          persistentVolumeClaim:
            claimName: web-data
---
# The ServiceAccount's access (spec O §8.3): a Role it may use through a RoleBinding, the
# built-in ClusterRole view through a ClusterRoleBinding, and a RoleBinding to a Role that
# does not exist. e2e/helpers/fixtures.ts deletes the ClusterRoleBinding with the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-config-reader
  namespace: skopos-e2e-map
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-config-reader
  namespace: skopos-e2e-map
subjects:
  - kind: ServiceAccount
    name: web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-config-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skopos-e2e-map-web-view
subjects:
  - kind: ServiceAccount
    name: web
    namespace: skopos-e2e-map
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-leader
  namespace: skopos-e2e-map
subjects:
  - kind: ServiceAccount
    name: web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-leader
---
# The NetworkPolicy and the CiliumNetworkPolicy select the web Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: skopos-e2e-map
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-l7
  namespace: skopos-e2e-map
spec:
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: web
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/.*"
---
# No Argo CD controller runs, so the Application carries the status the controller would
# write; the Application CRD has no status subresource, so apply writes it. Its status names
# the Deployment and the Service, which the map joins to it, and the Namespace, which the map
# counts in "Other resources".
apiVersion: v1
kind: Namespace
metadata:
  name: skopos-e2e-map-argocd
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: skopos-e2e-map
  namespace: skopos-e2e-map-argocd
spec:
  sourceRepos: ["https://git.example.test/map.git"]
  destinations:
    - server: https://kubernetes.default.svc
      namespace: skopos-e2e-map
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: skopos-e2e-map-argocd
spec:
  project: skopos-e2e-map
  source:
    repoURL: https://git.example.test/map.git
    path: web
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: skopos-e2e-map
status:
  sync:
    status: Synced
    revision: 4f2c9a1d0b6e8f7a3c5d9e1b2a4c6e8f0a1b3c5d
  health:
    status: Healthy
  resources:
    - group: apps
      version: v1
      kind: Deployment
      namespace: skopos-e2e-map
      name: web
      status: Synced
      health:
        status: Healthy
    - version: v1
      kind: Service
      namespace: skopos-e2e-map
      name: web
      status: Synced
      health:
        status: Healthy
    - version: v1
      kind: Namespace
      name: skopos-e2e-map
      status: Synced
