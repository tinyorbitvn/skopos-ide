alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
# The node-exporter binds its port on each node's host network; 9110 keeps it clear of
# the core test's release (crates/skopos-core/tests/metrics_kind.rs), which uses 9100.
prometheus-node-exporter:
  service:
    port: 9110
    targetPort: 9110
server:
  global:
    scrape_interval: 15s
    # Mimir's tenant tests (spec I65). The `prometheus` label keeps these samples apart from
    # the core tests' Prometheus, which writes to the same tenant.
    external_labels:
      cluster: skopos-e2e
      prometheus: skopos-e2e-metrics/skopos-e2e-prometheus
  remoteWrite:
    - url: http://mimir.skopos-e2e-mimir.svc:8080/api/v1/push
      headers:
        X-Scope-OrgID: skopos-tenant-a
  persistentVolume:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: skopos-e2e-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: skopos-e2e-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
