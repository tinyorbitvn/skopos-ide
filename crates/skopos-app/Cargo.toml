[package]
name = "skopos-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "skopos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
keyring = "4.2"
skopos-core = { path = "../skopos-core" }
serde.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }
