[package]
name = "skopos-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skopos-agent-host"
path = "src/bin/skopos-agent-host.rs"

[[bin]]
name = "skopos-fakeagent"
path = "src/bin/skopos-fakeagent.rs"

[[bin]]
name = "skopos-fakessh"
path = "src/bin/skopos-fakessh.rs"

[dependencies]
agent-client-protocol = { workspace = true, features = ["stdio"] }
base64 = "0.22"
dashmap.workspace = true
futures.workspace = true
directories = "6"
flate2 = "1.1"
http = "1"
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "client-proxy", "http1"] }
k8s-openapi.workspace = true
kube.workspace = true
notify = "8.2"
notify-debouncer-full = "0.7"
png = "0.18"
portable-pty = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "zeroize"] }
regex.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream"] }
rmcp.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
shell-words = "1.1.1"
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { workspace = true, features = ["compat"] }
tower-service = "0.3"
tracing.workspace = true
ts-rs.workspace = true
url = "2"
x509-parser = "0.18"
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
axum.workspace = true
hyper = { version = "1.12", features = ["http1", "server"] }
skopos-fakekube = { path = "../skopos-fakekube" }
promql-parser = "0.11"
tokio = { workspace = true, features = ["test-util"] }
x509-parser = { version = "0.18", features = ["verify"] }
