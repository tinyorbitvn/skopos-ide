<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SkoposIDE social card</title>
<!--
  The project site's link preview card (site/social-card.png), 1200 x 630 CSS pixels.
  scripts/social-image.mjs serves this file beside the site's own tokens, styles, ribbon,
  fonts, icon and pictures, and renders it in headless Chrome: make site-social.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="site.css">
<script src="ribbon.js" defer></script>
<style>
  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    isolation: isolate;
  }

  /* Centered on the card's height: a GitHub topic page shows the repository's social preview
     cropped to its middle 275 px band, about 88 to 541 px of this card. */
  .card__copy {
    position: absolute;
    z-index: 1;
    top: 50%;
    transform: translateY(-50%);
    left: 72px;
    width: 520px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .card__copy::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -48px -56px;
    background: var(--gray-950);
    opacity: 0.88;
    filter: blur(24px);
  }

  .card__brand {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    font: var(--type-display-2);
    font-size: 36px;
    letter-spacing: -0.02em;
  }

  .card__title {
    margin: 0;
    font: var(--type-display-2);
    font-size: 54px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }

  .card__title .grad {
    display: block;
  }

  .card__lead {
    margin: 0;
    font: var(--type-body-lg);
    font-size: 22px;
    line-height: 1.45;
    color: var(--text-secondary);
    text-wrap: pretty;
  }

  .card__meta {
    margin: 4px 0 0;
    font-size: 17px;
    color: var(--text-secondary);
  }

  /* The ribbon's fiber grain is noise a PNG cannot pack: sharp, the card weighs 660 KB. A
     3 px blur keeps the band and brings it under 300 KB, a size every preview loads. */
  .card .ribbon {
    filter: blur(3px);
  }

  .card__shot {
    position: absolute;
    z-index: 2;
    top: 112px;
    left: 664px;
    width: 980px;
  }
</style>
</head>
<body>
<main class="card">
  <div class="glow" aria-hidden="true"></div>
  <canvas class="ribbon" data-ribbon data-ribbon-angle="0.74" data-ribbon-offset="4" aria-hidden="true"></canvas>
  <div class="card__copy">
    <p class="card__brand"><img src="icon.svg" alt="" width="56" height="56">SkoposIDE</p>
    <h1 class="card__title">A desktop IDE for <span class="grad">the clusters you already run.</span></h1>
    <p class="card__lead">Live resources, logs, shells, YAML and metrics for every Kubernetes context in your kubeconfig.</p>
    <p class="card__meta mono">Linux · macOS · Windows</p>
  </div>
  <figure class="shot card__shot">
    <img src="images/canvas-pods-drawer-dark.png" alt="">
  </figure>
</main>
</body>
</html>
