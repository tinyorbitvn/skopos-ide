name: release

# Pushing a v* tag (scripts/release.sh bump, then git push --atomic origin main <tag>) checks
# the tag, runs the whole CI on it, drafts the release with its CHANGELOG notes, builds the four
# targets into that draft, and publishes it with the updater's latest.json once every build has
# passed. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: The tag names the version in every file, sits on main and has notes
        run: scripts/release.sh check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        name: Draft the release with its CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          scripts/release.sh notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"")"
          if grep -q ' false$' <<<"$releases"; then
            echo "::error::$tag is already published"
            exit 1
          fi
          id="$(sed -n '1s/ true$//p' <<<"$releases")"
          if [ -n "$id" ]; then
            # A rerun: keep the draft and its uploads, refresh the notes.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F body=@"$RUNNER_TEMP/notes.md" --silent
          else
            # Take the id from the create reply: the list lags behind a new draft.
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f name="SkoposIDE $tag" -F draft=true \
              -F prerelease="$PRERELEASE" -F body=@"$RUNNER_TEMP/notes.md" --jq .id)"
          fi
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::no release id for $tag (got '$id')"
            exit 1
          fi
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            rust-targets: ""
            args: ""
          - os: macos-15
            target: macos-arm64
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-15
            target: macos-x64
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-2022
            target: windows
            rust-targets: ""
            args: ""
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The Apple signing secrets live in this environment, which only v* tags may use.
    environment: release
    # Notarization waits on Apple.
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.rust-targets }}
          cache-key: ${{ matrix.target }}
      - name: The updater signing key is set
        env:
          KEY_SET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::the repository secret TAURI_SIGNING_PRIVATE_KEY is not set; see docs/releasing.md"
            exit 1
          fi
      - name: The Apple signing secrets are set
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          # A pasted .p12 may hold line breaks; only what is left after stripping them counts.
          certificate="$(printf '%s' "$CERTIFICATE" | tr -d '[:space:]')"
          problems=()
          [ -n "$certificate" ] || problems+=("lacks the secret APPLE_CERTIFICATE")
          [ -n "$CERTIFICATE_PASSWORD" ] || problems+=("lacks the secret APPLE_CERTIFICATE_PASSWORD")
          # The check after notarization compares this ID; a stray space would fail only there.
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] ||
            problems+=("needs the variable APPLE_TEAM_ID set to the 10-character Team ID")
          [ -n "$SIGNING_IDENTITY" ] || problems+=("lacks the variable APPLE_SIGNING_IDENTITY")
          if [ -n "$API_KEY" ]; then
            [ -n "$API_ISSUER" ] || problems+=("lacks the secret APPLE_API_ISSUER")
            [ -n "$API_PRIVATE_KEY" ] || problems+=("lacks the secret APPLE_API_PRIVATE_KEY")
          elif [ -n "$ID" ]; then
            [ -n "$PASSWORD" ] || problems+=("lacks the secret APPLE_PASSWORD")
          else
            problems+=("lacks the secrets APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY, or APPLE_ID and APPLE_PASSWORD")
          fi
          if [ "${#problems[@]}" -gt 0 ]; then
            for problem in "${problems[@]}"; do
              echo "::error::the release environment $problem; see docs/releasing.md"
            done
            exit 1
          fi
          # Pass the values to the later steps of this macOS build only, and only the
          # notarization method in use: Tauri picks a method by which variables exist.
          put() {
            local delimiter
            delimiter="EOF_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_ENV"
          }
          echo "::add-mask::$certificate"
          put APPLE_CERTIFICATE "$certificate"
          put APPLE_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$SIGNING_IDENTITY"
          put APPLE_TEAM_ID "$TEAM_ID"
          if [ -n "$API_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
            (umask 077 && printf '%s\n' "$API_PRIVATE_KEY" > "$key_path")
            put APPLE_API_KEY "$API_KEY"
            put APPLE_API_ISSUER "$API_ISSUER"
            put APPLE_API_KEY_PATH "$key_path"
          else
            put APPLE_ID "$ID"
            put APPLE_PASSWORD "$PASSWORD"
          fi
      # Pinned to a commit: this step gets the updater signing key. Bump by hand.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          # latest.json is built once, by the publish job, from all four builds.
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config crates/skopos-app/tauri.conf.json --config crates/skopos-app/tauri.updater.conf.json
      - name: Keep the exe for the Microsoft Store
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: target/release/skopos-app.exe
          retention-days: 7
      # Tauri notarized and stapled the app and signed the dmg; the dmg itself is ours.
      - name: Notarize and staple the dmg
        if: runner.os == 'macOS'
        timeout-minutes: 45
        run: node scripts/macos-trust.mjs notarize --dmg target/${{ matrix.rust-targets }}/release/bundle/dmg/*.dmg
      - name: Check the macOS files
        if: runner.os == 'macOS'
        run: >-
          node scripts/macos-trust.mjs check
          --dmg target/${{ matrix.rust-targets }}/release/bundle/dmg/*.dmg
          --updater target/${{ matrix.rust-targets }}/release/bundle/macos/SkoposIDE.app.tar.gz
          --team "$APPLE_TEAM_ID"
      # tauri-action uploaded the dmg before it was notarized.
      - name: Replace the dmg in the draft
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/${{ matrix.rust-targets }}/release/bundle/dmg/*.dmg --clobber
      # $GITHUB_ENV reaches every later step, the post-steps of the setup actions included.
      - name: Remove the Apple secrets from the job
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then rm -f -- "$APPLE_API_KEY_PATH"; fi
          {
            echo "APPLE_CERTIFICATE="
            echo "APPLE_CERTIFICATE_PASSWORD="
            echo "APPLE_API_KEY="
            echo "APPLE_API_ISSUER="
            echo "APPLE_API_KEY_PATH="
            echo "APPLE_ID="
            echo "APPLE_PASSWORD="
          } >> "$GITHUB_ENV"

  # The SBOM of what the four builds ship (docs/releasing.md, "SBOM").
  sbom:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          linux-libraries: "false"
      # Checks the download's SHA-256; the version matches CARGO_CYCLONEDX_VERSION in the Makefile.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx@0.5.10
          fallback: none
      - name: Build the SBOM
        run: make sbom
      - name: Upload the SBOM to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="SkoposIDE_${GITHUB_REF_NAME#v}.cdx.json"
          cp tmp/sbom/SkoposIDE.cdx.json "$RUNNER_TEMP/$name"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$name" --clobber

  publish:
    needs: [verify, draft, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build latest.json from the draft's updater files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir/sigs"
          gh api "$release" --jq .body > "$dir/notes.md"
          gh api "$release" --jq '.assets[].name' > "$dir/assets.txt"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir "$dir/sigs" --clobber
          node scripts/updater-manifest.mjs build --version "${GITHUB_REF_NAME#v}" \
            --notes "$dir/notes.md" --assets "$dir/assets.txt" --sigs "$dir/sigs" \
            --out "$dir/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$dir/latest.json" --clobber
      - name: Publish the draft once it holds every build
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          version="${GITHUB_REF_NAME#v}"
          names="$(gh api "$release" --jq '.assets[].name')"
          missing=()
          for suffix in amd64.AppImage amd64.deb aarch64.dmg x64.dmg x64-setup.exe; do
            name="SkoposIDE_${version}_${suffix}"
            grep -qxF "$name" <<<"$names" || missing+=("$name")
          done
          sbom="SkoposIDE_${version}.cdx.json"
          grep -qxF "$sbom" <<<"$names" || missing+=("$sbom")
          updater=(
            "SkoposIDE_${version}_amd64.AppImage.sig"
            "SkoposIDE_${version}_amd64.deb.sig"
            "SkoposIDE_${version}_x64-setup.exe.sig"
            "SkoposIDE_aarch64.app.tar.gz"
            "SkoposIDE_aarch64.app.tar.gz.sig"
            "SkoposIDE_x64.app.tar.gz"
            "SkoposIDE_x64.app.tar.gz.sig"
            "latest.json"
          )
          for name in "${updater[@]}"; do
            grep -qxF "$name" <<<"$names" || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::the draft lacks ${missing[*]}"
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then latest=false; else latest=true; fi
          gh api -X PATCH "$release" -F draft=false -f make_latest="$latest" \
            --jq '"\(.html_url) with \(.assets | length) assets"'
      - name: Installed copies find this release
        # A pre-release is not Latest, so the link still serves the last stable release.
        if: needs.verify.outputs.prerelease != 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          # The latest link can lag behind the publish for a moment.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -o "$RUNNER_TEMP/latest.json" "$url" &&
              node scripts/updater-manifest.mjs urls --version "$version" \
                --file "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/urls.txt"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::$url does not offer $version"
              exit 1
            fi
            sleep 20
          done
          while read -r asset; do
            curl -fsSIL -o /dev/null "$asset" || {
              echo "::error::$asset does not answer"
              exit 1
            }
          done < "$RUNNER_TEMP/urls.txt"

  # The Microsoft Store build (Store spec §4): the same exe as setup.exe, packed as an MSIX that
  # the Store signs. It runs after publish, so a failure here never touches the GitHub release.
  store:
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: windows-2022
    environment: store
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: tmp/windows-app
      - name: Pack the MSIX
        run: node scripts/msix.mjs --exe tmp/windows-app/skopos-app.exe --identity crates/skopos-app/msix/store.json --version "${GITHUB_REF_NAME#v}" --out tmp/msix
      # Windows PowerShell: PowerShell 7 can't load the Appx module on windows-2022.
      - name: Install and start the MSIX
        shell: powershell
        run: ./scripts/msix-install-check.ps1 -Msix (Get-ChildItem tmp/msix/*.msix).FullName -CheckRuntime
      - name: Keep the MSIX
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: tmp/msix/*.msix
          retention-days: 30
      - name: Install the Store CLI
        if: vars.STORE_SUBMIT == 'true'
        uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit to the Microsoft Store
        if: vars.STORE_SUBMIT == 'true'
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" \
            --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          store_id="$(node -p "require('./crates/skopos-app/msix/store.json').storeId")"
          # The CLI's first argument is a project folder; -i names the package inside it.
          msstore publish tmp/msix -i "tmp/msix/SkoposIDE_${GITHUB_REF_NAME#v}_x64.msix" -id "$store_id"
