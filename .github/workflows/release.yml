name: release

# Pushing a v* tag (scripts/release.sh bump, then git push --atomic origin main <tag>) checks
# the tag, runs the whole CI on it, drafts the release with its CHANGELOG notes, builds the four
# targets into that draft, and publishes it once every build has passed. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: The tag names the version in every file, sits on main and has notes
        run: scripts/release.sh check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        name: Draft the release with its CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          scripts/release.sh notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
          id_of() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\""
          }
          found="$(id_of)"
          if [ -z "$found" ]; then
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$tag" --draft --verify-tag --title "SkoposIDE $tag" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
            found="$(id_of)"
          elif [ "${found#* }" = true ]; then
            # A rerun: keep the draft and its uploads, refresh the notes.
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::error::$tag is already published"
            exit 1
          fi
          echo "release-id=${found%% *}" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            rust-targets: ""
            args: ""
          - os: macos-15
            target: macos-arm64
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-15
            target: macos-x64
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-2022
            target: windows
            rust-targets: ""
            args: ""
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.rust-targets }}
          cache-key: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          args: ${{ matrix.args }} --config crates/skopos-app/tauri.conf.json
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach target/*/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$mount_point"
          codesign --verify --deep --strict --verbose=2 "$mount_point/SkoposIDE.app"
          codesign --display --verbose=2 "$mount_point/SkoposIDE.app"
          hdiutil detach "$mount_point"

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then latest=--latest=false; else latest=--latest; fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "$latest"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '"\(.url) with \(.assets | length) assets"'
