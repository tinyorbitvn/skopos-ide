name: ci

# main is the only long-lived branch: CI runs on its pushes and on pull requests. The release
# workflow calls it for the tagged commit, and any branch can be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the older run; runs on main and on tags finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check
        run: make check

  linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Kind integration tests
        run: make test-kind
      - name: End-to-end tests
        run: make e2e
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/.tmp/*.log
          if-no-files-found: ignore

  # Hosted macOS runners cannot run the kind cluster, so macOS and Windows run the smoke set
  # against the fake cluster.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Smoke tests
        run: make e2e-smoke
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.os }}
          path: e2e/.tmp/*.log
          if-no-files-found: ignore
