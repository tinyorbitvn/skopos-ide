name: ci

# main is the only long-lived branch: CI runs on its pushes and on pull requests. The release
# workflow calls it for the tagged commit, and any branch can be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the older run; runs on main and on tags finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # The keychain test needs a keychain: macOS and Windows have one, Linux CI has no Secret Service.
      SKOPOS_KEYCHAIN_TEST: ${{ matrix.os != 'ubuntu-24.04' && '1' || '' }}
      # The agent sandbox tests need bubblewrap (Linux) or Seatbelt (macOS); Windows runs no agents.
      SKOPOS_SANDBOX_TEST: ${{ matrix.os != 'windows-2022' && '1' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Ubuntu 24.04's AppArmor keeps unprivileged users from creating user namespaces, which
      # bubblewrap needs for the agent sandbox.
      - name: Allow user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check
        run: make check

  linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # As in check: bubblewrap needs user namespaces for the agent sandbox.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Kind integration tests
        run: make test-kind
      - name: End-to-end tests
        run: make e2e
      # The run keeps the app logs only when it fails or had to kill an app that would
      # not quit, which does not fail it.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/.tmp/app-logs/
          include-hidden-files: true
          if-no-files-found: ignore

  # Hosted macOS runners cannot run the kind cluster, so macOS and Windows run the smoke set
  # against the fake cluster.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Smoke tests
        run: make e2e-smoke
      - name: Pack the MSIX
        if: runner.os == 'Windows'
        run: node scripts/msix.mjs --exe target/debug/skopos-app.exe --identity test --version "$(node -p "require('./crates/skopos-app/tauri.conf.json').version")" --out tmp/msix
      - name: Install and start the MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/msix-install-check.ps1 -Msix (Get-ChildItem tmp/msix/*.msix).FullName
      # As in linux-integration: only a failed run, or one that killed a stalled app, has logs.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.os }}
          path: e2e/.tmp/app-logs/
          include-hidden-files: true
          if-no-files-found: ignore

  # The release attaches this SBOM (docs/releasing.md); building it here catches a broken
  # generator before a tag.
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          linux-libraries: "false"
      # Checks the download's SHA-256; the version matches CARGO_CYCLONEDX_VERSION in the Makefile.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx@0.5.10
          fallback: none
      - name: Build the SBOM
        run: make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: tmp/sbom/SkoposIDE.cdx.json
          if-no-files-found: error
