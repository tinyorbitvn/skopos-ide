name: setup
description: Rust, Node 22 and pnpm with their caches, the Linux build libraries and bubblewrap, and the workspace's packages.

inputs:
  rust-targets:
    description: Extra Rust targets, comma-separated.
    default: ""
  cache-key:
    description: Extra Rust cache key, for jobs that build different targets on one runner image.
    default: ""
  linux-libraries:
    description: Install the Linux build libraries and bubblewrap; "false" for jobs that build and run nothing, such as the SBOM.
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: ${{ inputs.rust-targets }}
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
    - name: Install the Linux build libraries
      if: runner.os == 'Linux' && inputs.linux-libraries == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf xvfb
    # The agent sandbox (Linux) runs agents under bubblewrap.
    - name: Install bubblewrap
      if: runner.os == 'Linux' && inputs.linux-libraries == 'true'
      shell: bash
      run: sudo apt-get install -y bubblewrap
    - name: Install the packages
      shell: bash
      run: pnpm install --frozen-lockfile
